name: Update README cards

# 변경 요약 (기존 대비)
#  - stats 옵션에서 commits_year=2025 제거  → 매번 최신 기준으로 갱신
#  - include_all_commits=true 제거          → private 커밋 집계와 충돌하던 옵션 (검색 API는 공개 저장소만 봄)
#  - count_private=true 추가                → private 기여(커밋/PR/이슈/리뷰) 집계
#  - 스케줄을 하루 2회로 (선택)             → 수치 신선도 향상

on:
  schedule:
    - cron: "0 3,15 * * *"   # 매일 03:00, 15:00 UTC
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          # count_private=true 가 핵심. include_all_commits / commits_year 는 의도적으로 뺌.
          options: username=${{ github.repository_owner }}&show_icons=true&theme=gruvbox&locale=kr&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.MY_PAT }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          # PAT에 private 접근 권한이 있으면 private 저장소 언어도 함께 집계됨
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.MY_PAT }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
