name: Update README cards

# 변경 요약
#  - "Resolve current year" 스텝 추가 → 현재 연도를 동적으로 계산 (매년 자동 갱신, 수동 수정 불필요)
#  - stats 옵션에 commits_year=<올해> 명시 → 올해 커밋이 집계되도록 (작년 고정 문제 해결)
#  - count_private=true 유지 → private 기여 포함
#  - 스케줄 하루 2회 (선택)

on:
  schedule:
    - cron: "0 3,15 * * *"   # 매일 03:00, 15:00 UTC
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 현재 연도를 매 실행마다 계산 → commits_year 에 사용 (내년에 자동으로 2027 등으로 바뀜)
      - name: Resolve current year
        id: year
        run: echo "value=$(date -u +'%Y')" >> "$GITHUB_OUTPUT"

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          # count_private=true (private 포함) + commits_year=<올해> (올해 집계)
          options: username=${{ github.repository_owner }}&show_icons=true&theme=gruvbox&locale=kr&count_private=true&commits_year=${{ steps.year.outputs.value }}
          path: profile/stats.svg
          token: ${{ secrets.MY_PAT }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.MY_PAT }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
